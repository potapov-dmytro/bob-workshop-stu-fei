site_name: IBM Bob — STU FEI Workshop Guide
site_description: Hands-on lab guide for the IBM Bob Workshop at STU FEI — three tracks for Beginner, Intermediate, and Expert participants.
site_url: https://potapov-dmytro.github.io/bob-workshop-stu-fei
repo_url: https://github.com/potapov-dmytro/bob-workshop-stu-fei
repo_name: potapov-dmytro/bob-workshop-stu-fei
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/Bob_icon_sm.png
  favicon: assets/Bob_icon_sm.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/css/mermaid-theme.css

plugins:
  - search
  - glightbox
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
        - locale: sk
          name: Slovenčina
          build: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/potapov-dmytro/bob-workshop-stu-fei

nav:
  - Home: index.md
  - 🟢 Beginner:
    - labs/openslava-beginner.md
  - 🟡 Intermediate:
    - labs/openslava-intermediate.md
  - 🔴 Expert:
    - labs/openslava-expert.md
  - 🏆 Challenge:
    - labs/openslava-challenge.md
